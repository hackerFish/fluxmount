name: fluxmount
slug: fluxmount
version: 1.0.0
author: 张昌宇 (Changyu Zhang)
description: >-
  FluxMount 让 macOS 自由读写外接 NTFS 硬盘：基于 macFUSE + ntfs-3g，支持
  开机与热插拔自动挂载、多盘、幂等、健康自检、dry-run 预览、可回退卸载，
  并针对国内网络（GitHub 被墙、Homebrew Tier-3 无包）做了专门适配。
